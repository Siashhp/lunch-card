<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="午饭有谱">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23A85B1C'/%3E%3Cpath d='M14 30h36c0 10-8 18-18 18S14 40 14 30z' fill='%23fff'/%3E%3Crect x='26' y='17' width='12' height='4' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<meta name="description" content="午饭有谱：给双职工家庭和带娃老人的一周午饭安排、买菜清单，和精确到分钟的厨房流程，老人在家照着做就行。">
<title>午饭有谱 · 一周午饭排好，几点动手也写着</title>
<style>
:root{
  --bg:#FAF8F4;--card:#FFFFFF;--ink:#2A2622;--ink2:#6B6259;--ink3:#787066;
  --line:#E9E3D9;--brand:#A85B1C;--brand-soft:#FBF0E4;
  --ok:#3F7A4B;--ok-soft:#EDF5EE;--warn:#A8452F;--warn-soft:#FBEDE9;
  --mid:#786850;--mid-soft:#F4EFE6;
  --radius:14px;
  --fs:1;              /* 字号倍率。1 = 默认；大字模式往上调 */
}
/* 大字模式：只把字和可点区域放大，不删内容、不改页面结构。
   做饭的人站在灶前看手机，要的是「一眼看清 + 别点错」。 */
html.elder{
  --fs:1.22;
  --ink3:#6B6259;      /* 辅助文字再压深一档，5.97:1 */
}
html.elder .tl .t{width:72px}
html.elder .tl li{padding:14px 0}
html.elder .tl .tick{width:48px;height:48px;font-size:18px}
html.elder .tl-hero .big{font-size:30px}
html.elder .pill{min-height:48px;padding:11px 14px}
html.elder .chip{min-height:46px;padding:11px 14px}
html.elder .ob-num button{width:48px;height:48px;font-size:22px}
html.elder .sh-title{font-size:23px}
html.elder nav button{min-height:54px;padding:12px 0 10px}
/* 时间线第一行（开饭前 X 分钟）单独提亮加大，老人只要这一个数 */
html.elder .tl .d-lead{font-size:16px;color:var(--ink2);margin-bottom:1px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom));
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:calc(15px * var(--fs,1));line-height:1.62}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:22px 0 6px}
h1{font-size:20px;font-weight:500;margin:0 0 4px;letter-spacing:.02em}
.sub{font-size:calc(12.5px * var(--fs,1));color:var(--ink3);margin:0}
h2{font-size:calc(14px * var(--fs,1));font-weight:500;margin:22px 0 8px;color:var(--ink2);letter-spacing:.02em}
.cnt{font-size:calc(11.5px * var(--fs,1));font-weight:400;color:var(--ink3);margin-left:5px}
.bar{display:flex;gap:8px;align-items:center;margin:14px 0 4px;flex-wrap:wrap}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
.btn{padding:9px 15px;border-radius:10px;background:var(--brand);color:#fff;font-size:calc(14px * var(--fs,1));
  transition:opacity .15s ease}
.btn.ghost{background:var(--card);color:var(--ink2);border:1px solid var(--line)}
.btn:active{opacity:.75}
.btn:focus-visible,.pill:focus-visible,.chip:focus-visible,nav button:focus-visible{
  outline:2px solid var(--brand);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin:12px 0}
.day-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
/* 周次条：让人一眼知道现在看的是哪一周，也能切回本周 */
.wkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.wk-lab{display:flex;align-items:baseline;gap:8px}
.wk-lab b{font-size:calc(15px * var(--fs,1));font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wk-lab i{font-style:normal;font-size:calc(11.5px * var(--fs,1));color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:6px}
.wk-sw{display:flex;gap:6px}
.day-name{font-size:calc(15.5px * var(--fs,1));font-weight:500}
.day-name .today-tag{font-size:calc(10.5px * var(--fs,1));color:#fff;background:var(--brand);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.day-date{font-size:calc(12.5px * var(--fs,1));color:var(--ink3)}
.form-tag{display:inline-block;font-size:calc(11.5px * var(--fs,1));color:var(--brand);background:var(--brand-soft);
  border-radius:6px;padding:2px 7px;margin:7px 0 2px}
.dish{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 0;border-bottom:1px dashed var(--line);width:100%;text-align:left}
.dish:last-of-type{border-bottom:0}
.dish-main{flex:1;min-width:0;padding:0;text-align:left}
.dish-n{font-size:calc(15px * var(--fs,1));display:block}
.dish-m{font-size:calc(11.5px * var(--fs,1));color:var(--ink3)}
.dish-r{display:flex;gap:5px;flex-shrink:0}
.pill{font-size:calc(12.5px * var(--fs,1));padding:9px 12px;border-radius:9px;border:1px solid var(--line);color:var(--ink2);background:#fff;
  white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.pill.on-ok{background:var(--ok-soft);border-color:#C9DFCC;color:var(--ok)}
.pill.on-mid{background:var(--mid-soft);border-color:#E0D5C2;color:var(--mid)}
.pill.on-bad{background:var(--warn-soft);border-color:#EBCFC7;color:var(--warn)}
.newflag{font-size:calc(10.5px * var(--fs,1));color:#fff;background:var(--brand);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.total{font-size:calc(12px * var(--fs,1));color:var(--ink3);margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.total b{font-weight:500;color:var(--ink2)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:20}
nav .inner{max-width:640px;margin:0 auto;display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 9px;font-size:calc(11.5px * var(--fs,1));color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:46px}
nav button.on{color:var(--brand)}
nav .dot{width:5px;height:5px;border-radius:50%;background:transparent}
nav button.on .dot{background:var(--brand)}
.view{display:none}
.view.on{display:block}

.tl-hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.tl-hero .big{font-size:26px;font-weight:500;letter-spacing:.02em;line-height:1.3}
.tl-hero .meta{font-size:calc(12.5px * var(--fs,1));color:var(--ink3);margin-top:4px}
.tl-hero .warnline{margin-top:10px;font-size:calc(13px * var(--fs,1));color:var(--warn);background:var(--warn-soft);border-radius:9px;padding:8px 11px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .t{font-size:calc(14px * var(--fs,1));color:var(--brand);font-variant-numeric:tabular-nums;width:52px;flex-shrink:0;font-weight:500}
.tl .b{flex:1;min-width:0}
.tl .n{display:block;font-size:calc(16.5px * var(--fs,1));line-height:1.4}
.tl .d{display:block;font-size:calc(12px * var(--fs,1));color:var(--ink3);margin-top:2px}
.tl li.passive .t{color:var(--ink3)}
.tl li.serve .n{font-weight:500}
.tl li.done .n{color:var(--ink3);text-decoration:line-through}
/* 勾选按钮 44px 起步：这一列是站在灶前的人点的，行高本来就由文字撑到 ~64px，放大它不额外占地方 */
.tl .tick{width:44px;height:44px;border:1px solid var(--line);border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:calc(17px * var(--fs,1));color:transparent;background:#fff}
.tl li.done .tick{background:var(--ok-soft);border-color:#C9DFCC;color:var(--ok)}

.shop-group{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 15px;margin:12px 0}
.shop-h{font-size:calc(13px * var(--fs,1));color:var(--brand);padding:10px 0 4px;letter-spacing:.04em}
.shop-i{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:calc(15px * var(--fs,1));width:100%;text-align:left}
.shop-i:last-child{border-bottom:0}
.shop-i .box{width:26px;height:26px;border:1px solid var(--line);border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:calc(13px * var(--fs,1));color:transparent;background:#fff}
.shop-i.got .box{background:var(--ok-soft);border-color:#C9DFCC;color:var(--ok)}
.shop-i.got .nm{color:var(--ink3);text-decoration:line-through}
.shop-i .nm{flex:1;min-width:0}
.shop-i .q{color:var(--ink2);font-size:calc(13.5px * var(--fs,1));font-variant-numeric:tabular-nums;white-space:nowrap}

.hint{font-size:calc(12.5px * var(--fs,1));color:var(--ink3);line-height:1.65;margin:8px 0}
/* 激活码很长（一百多个字符），用 textarea 平铺，别让人在一个单行框里左右找 */
.inp{width:100%;box-sizing:border-box;margin:8px 0 0;padding:10px 11px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);font-size:calc(12.5px * var(--fs,1));line-height:1.55;
  resize:vertical;font-family:inherit}
.inp.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.inp:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
label.pk{display:block;font-size:calc(13px * var(--fs,1));color:var(--ink2);font-weight:600;margin:0 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 2px}
.chip{font-size:calc(13.5px * var(--fs,1));padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  min-height:38px;display:inline-flex;align-items:center}
.chip.on{background:var(--brand-soft);border-color:#EBCFAE;color:var(--brand)}
.chip.off{opacity:.45;text-decoration:line-through}
.chip .tag{font-size:calc(10.5px * var(--fs,1));color:var(--ink3);margin-left:4px}
/* `.row` 还在给买菜页的「已买 X / Y 样」用；成对的输入控件走下面的 .prow */
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.row:last-child{border-bottom:0}
.row .k{font-size:calc(14.5px * var(--fs,1))}
.row .v{font-size:calc(12.5px * var(--fs,1));color:var(--ink3);text-align:right}
/* 大人/孩子这种成对的数字挤一行，不再各占一行 */
.prow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prow .pg{display:flex;align-items:center;gap:7px;flex:1 1 auto;min-width:0}
.prow .pk{font-size:calc(14.5px * var(--fs,1))}
.prow .pn{min-width:22px;text-align:center;font-size:calc(15px * var(--fs,1));color:var(--ink);font-variant-numeric:tabular-nums}
.empty{color:var(--ink3);font-size:calc(13.5px * var(--fs,1));text-align:center;padding:30px 0}
.tipbar{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 13px;margin:10px 0 0;
  font-size:calc(12.5px * var(--fs,1));line-height:1.6}
.gesture{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.gesture div{flex:1;min-width:96px;background:var(--bg);border-radius:10px;padding:9px 10px;font-size:calc(11.5px * var(--fs,1));color:var(--ink2);line-height:1.5}
.gesture b{display:block;font-size:calc(13px * var(--fs,1));font-weight:500;color:var(--ink);margin-bottom:2px}

dialog#sheet{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0 auto;width:100%;max-width:640px;
  border:0;border-radius:18px 18px 0 0;padding:18px 18px 26px;max-height:88vh;overflow:auto;
  background:var(--card);color:var(--ink);box-shadow:0 -8px 40px rgba(42,38,34,.18)}
dialog#sheet::backdrop{background:rgba(30,26,20,.42)}
dialog#sheet[open]{animation:up .18s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  dialog#sheet[open]{animation:none}
  .btn{transition:none}
}
.sh-title{font-size:19px;font-weight:500;margin:0 0 2px}
.sh-meta{font-size:calc(12.5px * var(--fs,1));color:var(--ink3);margin-bottom:14px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:11px 0 11px 34px;font-size:calc(16px * var(--fs,1));line-height:1.6;border-bottom:1px solid var(--line)}
.steps li:before{content:counter(s);position:absolute;left:0;top:11px;width:24px;height:24px;
  border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:calc(13px * var(--fs,1));
  display:flex;align-items:center;justify-content:center}
.steps li:last-child{border-bottom:0}
.sh-note{margin-top:14px;font-size:calc(13px * var(--fs,1));color:var(--ink2);background:var(--brand-soft);border-radius:10px;padding:11px 13px;line-height:1.6}
.sh-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sh-actions .btn{flex:1;min-width:120px;text-align:center}

/* ---------- 初次设置 ---------- */
.ob{position:fixed;inset:0;background:var(--bg);z-index:70;overflow:auto;
  -webkit-overflow-scrolling:touch;display:none}
.ob.on{display:block}
.ob-wrap{max-width:640px;margin:0 auto;padding:26px 20px calc(30px + env(safe-area-inset-bottom))}
.ob-dots{display:flex;gap:6px;margin-bottom:26px}
.ob-dots i{height:3px;flex:1;border-radius:2px;background:var(--line)}
.ob-dots i.on{background:var(--brand)}
.ob-q{font-size:21px;font-weight:500;line-height:1.5;margin:0 0 8px}
.ob-s{font-size:calc(13px * var(--fs,1));color:var(--ink3);margin:0 0 20px;line-height:1.7}
/* 引导第 1 步的两个人数：一行放得下就并排，放不下自动折回两行 */
.ob-nums{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ob-num{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1 1 176px;padding:0;border-bottom:0}
.ob-num .k{font-size:calc(16.5px * var(--fs,1))}
.ob-num .ctrl{display:flex;align-items:center;gap:14px}
.ob-num button{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;font-size:20px;
  background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center;line-height:1}
.ob-num button:disabled{opacity:.32}
.ob-num .n{font-size:20px;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.ob-opts{display:flex;flex-direction:column;gap:10px}
.ob-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);text-align:left;width:100%;
  transition:border-color .12s ease,background .12s ease}
.ob-opt b{font-size:calc(16px * var(--fs,1));font-weight:500;display:block}
.ob-opt span span{font-size:calc(12.5px * var(--fs,1));color:var(--ink3);display:block;margin-top:2px;line-height:1.5}
.ob-opt.on{border-color:var(--brand);background:var(--brand-soft)}
.ob-opt .mk{width:21px;height:21px;border-radius:50%;border:1px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:calc(12px * var(--fs,1));color:transparent;background:#fff}
.ob-opt.on .mk{background:var(--brand);border-color:var(--brand);color:#fff}
.ob-foot{display:flex;gap:10px;margin-top:28px}
.ob-foot .btn{flex:1}
.ob-res{text-align:center;padding-top:8px}
.ob-res .big{font-size:25px;font-weight:500;margin:0 0 10px}
.ob-res .nums{display:flex;gap:9px;margin:20px 0 16px}
.ob-res .nums div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 6px}
.ob-res .nums b{display:block;font-size:25px;font-weight:500;color:var(--brand);
  font-variant-numeric:tabular-nums;line-height:1.2}
.ob-res .nums span{font-size:calc(11px * var(--fs,1));color:var(--ink3)}
.ob-elder{text-align:center;margin:16px 0 0}
.ob-elder button{font-size:calc(14px * var(--fs,1));color:var(--brand);
  text-decoration:underline;text-underline-offset:3px;padding:10px 8px}

@media print{
  body{background:#fff;padding:0}
  nav,.bar,.no-print,#v-today,#v-lib,#v-set{display:none!important}
  #v-week,#v-shop{display:block!important}
  .wrap{max-width:none;padding:0}
  .card,.shop-group{break-inside:avoid;margin:0 0 8px;border:1px solid #ddd}
  .dish{border-bottom:1px dotted #ddd}
  .pill,.newflag,.today-tag{display:none}
  header{padding-top:0}
  .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div id="insecureTip" class="tipbar no-print" style="display:none"></div>
  <header>
    <h1>午饭有谱</h1>
    <p class="sub" id="subhead">一周午饭排好了，几点该动手也写着</p>
    <div class="bar no-print">
      <button class="btn" id="btnGen" type="button">重新排一周</button>
      <button class="btn ghost" id="btnCopyAll" type="button">整周发文字</button>
      <button class="btn ghost" id="btnShare" type="button">发链接</button>
      <button class="btn ghost" id="btnPrint" type="button">打印 / 贴冰箱</button>
    </div>
  </header>

  <main>
    <section class="view on" id="v-week" aria-label="本周菜单"></section>
    <section class="view" id="v-today" aria-label="今天的流程"></section>
    <section class="view" id="v-shop" aria-label="本周采购清单"></section>
    <section class="view" id="v-lib" aria-label="菜库"></section>
    <section class="view" id="v-set" aria-label="设置"></section>
  </main>
  <noscript><p class="hint">这个页面需要开启 JavaScript 才能排菜单。</p></noscript>
</div>

<nav class="no-print" aria-label="主导航"><div class="inner">
  <button data-v="week" class="on" type="button"><span class="dot"></span>本周</button>
  <button data-v="today" type="button"><span class="dot"></span>今天</button>
  <button data-v="shop" type="button"><span class="dot"></span>买菜</button>
  <button data-v="lib" type="button"><span class="dot"></span>菜库</button>
  <button data-v="set" type="button"><span class="dot"></span>设置</button>
</div></nav>

<dialog id="sheet" aria-label="菜品详情"><div id="sheetBody"></div></dialog>

<div id="ob" class="ob" hidden aria-label="初次设置">
  <div class="ob-wrap">
    <div class="ob-dots" id="obDots"></div>
    <div id="obBody"></div>
    <div class="ob-foot" id="obFoot">
      <button class="btn ghost" id="obPrev" type="button">上一步</button>
      <button class="btn" id="obNext" type="button">下一步</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
try{
var DISHES=[
{id:"tomato-egg",n:"番茄炒蛋",t:"protein",p:"egg",c:"red",lv:"A",min:8,dev:[],

 steps:["买现成烙馍，上锅蒸 2 分钟回软","卷菜吃：土豆丝、豆芽、卤肉都行"],
 note:"卷饼形态的最佳载体，孩子自己卷着吃，参与感强。"},

{id:"dasuan-tai",n:"蒜苔炒肉丝",t:"protein",p:"pork",c:"green",lv:"A",min:12,dev:[],reg:"豫",cuis:["north"],
 steps:["瘦肉切丝，加生抽、淀粉抓匀腌 10 分钟","蒜苔切段，下锅炒 1 分钟盛出","肉丝下锅滑散炒到变色","倒回蒜苔，加盐翻炒出锅"],
 note:"河南家常下饭菜。蒜苔别炒太久，断生就好。"},
{id:"qincai-rou",n:"芹菜炒肉丝",t:"protein",p:"pork",c:"green",lv:"A",min:12,dev:[],
 steps:["瘦肉切丝，用生抽、淀粉腌 10 分钟","芹菜切段，焯水 30 秒捞出","肉丝下锅炒散，加芹菜大火翻炒","加盐、少许生抽，出锅"],
 note:"芹菜焯一下去涩味，孩子更容易接受。"},
{id:"hongshao-jitui",n:"红烧鸡腿",t:"protein",p:"chicken",c:"brown",lv:"A",min:30,dev:[],
 steps:["鸡腿两面划刀，冷水下锅焯 2 分钟","锅里少油，鸡腿煎到微黄，加姜片、生抽两勺、老抽半勺","倒热水没过，加一颗冰糖，中小火炖 20 分钟","大火收汁"],
 note:"孩子最认的一道。炖上就不用管，可以同时炒菜。"},
{id:"fanqie-niunan",n:"番茄炖牛腩",t:"protein",p:"beef",c:"red",lv:"A",min:45,dev:["pressure"],
 steps:["牛腩切块焯水，冲净浮沫","番茄两个切块，下锅炒出汁","加牛腩、姜片、热水，压力锅上汽压 20 分钟","泄压后加盐，撒葱花"],
 note:"番茄的酸让牛肉更烂。汤别倒，泡饭一流。"},
{id:"doufu-pi",n:"豆腐皮炒肉",t:"protein",p:"tofu",c:"white",lv:"A",min:12,dev:[],
 steps:["豆腐皮切条，开水烫 1 分钟捞出","肉丝用生抽、淀粉腌 10 分钟","肉丝下锅炒散，下豆腐皮翻炒","加一勺生抽、少许盐，出锅"],
 note:"豆腐皮蛋白质高，比豆腐耐嚼，孩子嚼得动。"},
{id:"luji-tui",n:"卤鸡腿（买现成）",t:"protein",p:"chicken",c:"brown",lv:"A",min:5,dev:[],
 steps:["买现成卤好的，微波或蒸 2 分钟","切开方便孩子拿"],
 note:"赶时间的时候用。不用天天自己卤。"},
{id:"tangcu-liji",n:"糖醋里脊（空气炸锅）",t:"protein",p:"pork",c:"red",lv:"B",min:30,dev:["airfryer"],
 steps:["里脊切条，加盐、料酒、蛋液、淀粉抓匀","表面裹一层面包糠，喷点油","空气炸锅 190 度烤 12 分钟，中途翻一次","锅里调糖醋汁（番茄酱、糖、醋各一勺）烧稠，倒进里脊翻匀"],
 note:"新菜候选。孩子最爱，但工序多，一周最多做一次。"},
{id:"dahuicai",n:"河南大烩菜",t:"protein",p:"tofu",c:"white",lv:"A",min:30,dev:[],reg:"豫",cuis:["north"],
 steps:["白菜切块，豆腐切片，粉条提前泡软","五花肉片煸出油，下白菜炒软","加水、豆腐、粉条、几个丸子，炖 15 分钟","加盐、生抽，撒蒜苗"],
 note:"一锅炖，越炖越香。冬天配馒头，孩子连汤都喝。"},
{id:"jiachang-doufu",n:"家常豆腐",t:"protein",p:"tofu",c:"white",lv:"A",min:15,dev:[],
 steps:["老豆腐切片，平底锅少油煎到两面微黄","青椒切块，下锅炒 1 分钟","加一勺生抽、半碗水，下豆腐小火煮 3 分钟","淋淀粉水勾薄芡"],
 note:"豆腐先煎一下不易碎，也更容易入味。"},

{id:"hongshao-daiyu",n:"红烧带鱼",t:"protein",p:"fish",c:"brown",lv:"A",min:25,dev:[],
 steps:["带鱼段解冻擦干，两面拍一层薄面粉","平底锅少油，两面煎到微黄定型","加姜片、生抽两勺、料酒一勺、小半碗水","中小火焖 8 分钟收汁"],
 note:"带鱼只有一根主刺，孩子吃着安全。煎定型再翻，不容易散。"},
{id:"fanqie-yupian",n:"番茄鱼片",t:"protein",p:"fish",c:"red",lv:"A",min:20,dev:[],
 steps:["龙利鱼柳切片，加盐、蛋清、淀粉抓匀腌 10 分钟","番茄切块炒出汁，加两碗水烧开","鱼片一片片下锅，煮 2 分钟变白就捞","加盐，撒葱花"],
 note:"龙利鱼无刺，孩子最适合。鱼片下锅后别搅，容易碎。"},
{id:"xiangjian-longli",n:"香煎龙利鱼",t:"protein",p:"fish",c:"white",lv:"A",min:12,dev:[],
 steps:["龙利鱼柳解冻吸干水，抹盐和黑胡椒腌 10 分钟","平底锅少油，中火每面煎 3 分钟","出锅挤几滴柠檬汁或撒孜然"],
 note:"全程中火，火大了外面焦里面生。配番茄酱孩子更爱。"},
{id:"suancai-yu",n:"酸菜鱼",t:"protein",p:"fish",c:"white",lv:"B",min:35,dev:[],
 steps:["草鱼片用盐、蛋清、淀粉腌 10 分钟（或直接买鱼片）","酸菜下锅炒香，加水烧开煮 5 分钟","鱼片下锅煮 2 分钟","撒干辣椒花椒，浇一勺热油"],
 note:"新菜候选。辣的，孩子那份先盛出来再放辣椒。"},

{id:"shousi-baocai",n:"手撕包菜",t:"veg",p:"veg",c:"green",lv:"A",min:8,dev:[],
 steps:["包菜用手撕成片（手撕比刀切好吃），洗净沥干","锅烧到冒烟倒油，下干辣椒或蒜末","包菜下锅大火快炒 1 分半","加盐、几滴醋，出锅"],
 note:"便宜、快、孩子接受度高。火要大，不然出水。"},
{id:"culiu-baicai",n:"醋溜白菜",t:"veg",p:"veg",c:"white",lv:"A",min:10,dev:[],
 steps:["白菜帮斜刀切片，叶子撕开分开","先下白菜帮炒 1 分钟，再下叶子","沿锅边淋一勺醋，加盐、少许糖","翻炒出锅"],
 note:"帮和叶分开下，熟得才一致。"},
{id:"kongxincai",n:"蒜蓉空心菜",t:"veg",p:"veg",c:"green",lv:"A",min:7,dev:[],
 steps:["空心菜洗净掐段，蒜切末","锅冒烟倒油，蒜末爆香","下菜大火快炒 1 分钟","加盐，立刻出锅"],
 note:"夏天最常见。炒久了发黑。"},
{id:"liangban-muer",n:"凉拌木耳",t:"veg",p:"veg",c:"white",lv:"A",min:8,dev:[],cold:1,
 steps:["木耳提前泡发，撕小朵，开水焯 1 分钟","捞出过凉水，沥干","加蒜末、生抽、醋、香油、一点糖拌匀"],
 note:"提前泡好放冰箱，吃的时候拌一下就行。"},
{id:"zheng-huluobo",n:"蒸胡萝卜丝",t:"veg",p:"veg",c:"orange",lv:"A",min:20,dev:["steamer"],reg:"豫",cuis:["north"],
 steps:["胡萝卜擦丝，拌一层面粉，抖散","上蒸锅，水开蒸 8 分钟","出锅趁热抖散，拌蒜汁、香油、盐"],
 note:"河南蒸菜。孩子当主食吃都行，比炒的更容易接受。"},
{id:"zheng-qincaiye",n:"蒸芹菜叶",t:"veg",p:"veg",c:"green",lv:"A",min:20,dev:["steamer"],reg:"豫",cuis:["north"],
 steps:["芹菜叶洗净沥干，拌面粉抖散","上蒸锅，水开蒸 8 分钟","出锅拌蒜汁、香油、少许盐"],
 note:"买芹菜剩下的叶子别扔，这道最省。老人基本都会。"},

{id:"luobo-paigu",n:"萝卜排骨汤",t:"soup",p:"soup",c:"white",lv:"A",min:45,dev:["pressure"],
 steps:["排骨焯水冲净，白萝卜切滚刀块","一起放压力锅，加姜片、两碗水","上汽压 20 分钟，自然泄压","加盐、白胡椒，撒香菜"],
 note:"冬天必备。萝卜炖透了孩子也吃。"},
{id:"yumi-geng",n:"蛋花玉米羹",t:"soup",p:"soup",c:"yellow",lv:"A",min:10,dev:[],
 steps:["玉米粒一碗，加水两碗煮开","淋淀粉水勾薄芡","鸡蛋打散淋入，搅出蛋花","加少许盐或糖（甜的咸的看孩子）"],
 note:"甜的咸的都行，孩子基本都喝。"},
{id:"suanla-tang",n:"酸辣汤",t:"soup",p:"soup",c:"brown",lv:"B",min:12,dev:[],
 steps:["豆腐丝、木耳丝、胡萝卜丝下锅加水烧开","加生抽、醋、白胡椒，淋淀粉水","淋蛋液，撒香菜"],
 note:"新菜候选。白胡椒少放，孩子怕辣。"},
/* --- 郑州：学生午餐版，饼丝和面汤是本地孩子吃惯的 --- */
{id:"menbing",n:"焖饼",t:"staple",p:"staple",c:"brown",lv:"A",min:15,dev:[],cuis:["north"],
 steps:["五花肉切细丝，现成烙馍或饼切细丝","锅里少油，肉丝滑散，下豆芽和青菜炒 2 分钟","下饼丝，加两勺水、一点生抽","盖锅焖 3 分钟，水收干拌匀"],
 note:"用现成饼丝省事，菜市场的饼店都能切。肉丝先炒出油，饼丝才不干。水别多，一勺一勺加，饼才不烂。"},
{id:"jidan-miantang",n:"鸡蛋面汤",t:"soup",p:"soup",c:"yellow",lv:"A",min:10,dev:[],cuis:["north"],
 steps:["面粉加冷水调成稀糊，别有小疙瘩","锅里水烧开，一边搅一边倒面糊","小火煮 3 分钟到微稠","淋蛋液，加盐，关火"],
 note:"面糊一定要用冷水调，热水会结块。河南人早上喝这个，中午配饼也行。"},
{id:"xihulu-chaojidan",n:"西葫芦炒鸡蛋",t:"protein",p:"egg",c:"green",lv:"A",min:12,dev:[],cuis:["north"],
 steps:["西葫芦切薄片，鸡蛋加一点盐打散","热锅炒蛋，刚凝固就盛出","下西葫芦大火炒 2 分钟","倒回鸡蛋，加盐炒匀"],
 note:"西葫芦别炒太久，软塌了就没口感。孩子最爱的一道。"},

/* ---------- 川湘 ---------- */
{id:"mapo-tofu",n:"麻婆豆腐",t:"protein",p:"tofu",c:"red",lv:"A",min:15,dev:[],cuis:["sichuan"],
 steps:["嫩豆腐切 2 厘米方块，放淡盐水里泡 5 分钟","肉末下锅炒散，加一勺豆瓣酱炒出红油","加小半碗水烧开，下豆腐小火煮 4 分钟，别用铲子翻，晃锅就行","淋淀粉水勾芡，撒花椒面和葱花"],
 note:"豆瓣酱本身很咸，不用再放盐。孩子那份先盛出来，花椒面最后才撒。"},
{id:"huiguo-rou",n:"回锅肉",t:"protein",p:"pork",c:"brown",lv:"A",min:20,dev:[],cuis:["sichuan"],
 steps:["五花肉整块冷水下锅，加姜片煮 15 分钟，筷子能扎透就捞出","放凉后切薄片，越薄越好","锅里不放油，肉片下锅中火煸到卷起来、边缘微黄","加一勺豆瓣酱炒出红油，下蒜苗段炒 1 分钟出锅"],
 note:"肉要煮透放凉再切，不然切不薄。煸出来的油别倒，正好炒蒜苗。"},
{id:"yuxiang-rousi",n:"鱼香肉丝",t:"protein",p:"pork",c:"red",lv:"A",min:15,dev:[],cuis:["sichuan"],
 steps:["里脊切细丝，加一勺生抽、半勺淀粉抓匀腌 10 分钟","木耳泡发切丝，胡萝卜切丝","小碗里先调汁：两勺糖、两勺醋、一勺生抽、半勺淀粉、三勺水","肉丝下锅炒散盛出，下木耳胡萝卜炒 1 分钟，倒回肉丝，淋汁翻匀出锅"],
 note:"糖和醋是一比一，汁要先调好再下锅，不然一边炒一边配会手忙脚乱。"},
{id:"duojiao-yutou",n:"剁椒蒸鱼头",t:"protein",p:"fish",c:"red",lv:"B",min:20,dev:["steamer"],cuis:["sichuan"],
 steps:["鱼头从中间劈开但不切断，洗净血水擦干","抹一勺料酒和少许盐，铺上姜末","鱼头摊开放盘，铺满剁椒","水开后蒸 12 分钟，出锅淋一勺热油，撒葱花"],
 note:"新菜候选。剁椒有咸味，盐要少放。孩子不吃辣就把剁椒拨到一边。"},
{id:"ganbian-sijidou",n:"干煸四季豆",t:"veg",p:"veg",c:"green",lv:"A",min:14,dev:[],cuis:["sichuan"],
 steps:["四季豆掐头去尾掰成段，洗净后一定要擦干","锅里多放点油，中小火把四季豆煸到表皮起皱发白，捞出","锅里留底油，下肉末和一点芽菜炒香","倒回四季豆，加盐翻匀出锅"],
 note:"四季豆必须煸透，半生的会中毒。表皮起皱发白才算到位。"},
{id:"suanrong-youmaicai",n:"蒜蓉油麦菜",t:"veg",p:"veg",c:"green",lv:"A",min:6,dev:[],cuis:["sichuan"],
 steps:["油麦菜洗净掐成段，蒜切末","锅烧到冒烟倒油，下一半蒜末爆香","菜下锅大火快炒 1 分钟","加盐和剩下的一半蒜末，翻两下出锅"],
 note:"生蒜分两次放，起锅前那次最出味。炒久了会出水发黑。"},
{id:"dandan-mian",n:"担担面",t:"staple",p:"staple",c:"red",lv:"A",min:15,dev:[],cuis:["sichuan"],
 steps:["碗底放一勺芝麻酱、一勺生抽、半勺醋、一勺红油、一点花椒面","加两勺开水把调料化开","面条煮熟捞进碗里","撒芽菜碎、花生碎和葱花，拌开吃"],
 note:"调料先在碗里化开再放面，不然拌不匀。孩子那碗不放红油。"},
{id:"suanla-fen",n:"酸辣粉",t:"staple",p:"staple",c:"red",lv:"B",min:15,dev:[],cuis:["sichuan"],
 steps:["红薯粉用温水泡 20 分钟到软","碗底放生抽、醋、红油、花椒面、蒜末","水开下粉煮 3 分钟，连汤舀进碗里","撒花生碎、香菜和榨菜末"],
 note:"新菜候选。醋要最后放，跟着一起煮就没酸味了。"},
{id:"cai-xifan",n:"菜稀饭",t:"staple",p:"staple",c:"green",lv:"A",min:35,dev:[],cuis:["sichuan"],
 steps:["大米淘净，比平时多加两碗水","大火烧开转小火，熬 20 分钟到米粒开花","青菜洗净切碎，最后 5 分钟下锅","加一点点盐，搅匀关火"],
 note:"青菜最后下，早了发黄发苦。配一碟泡菜就是一顿。"},
{id:"hongshu-fan",n:"红薯焖饭",t:"staple",p:"staple",c:"orange",lv:"A",min:30,dev:[],cuis:["sichuan"],
 steps:["红薯去皮切滚刀块，别切太小，不然焖化了","米淘净，水比平时少一勺（红薯会出水）","红薯铺在米上，电饭锅标准档","跳闸后焖 10 分钟，拌匀再盛"],
 note:"红薯挑红心的，甜。冬天的最好吃。"},
/* --- 成都 / 重庆 / 长沙 / 武汉：学生午餐版，都控制在 25 分钟内、不油炸 --- */
{id:"wosun-rousi",n:"莴笋炒肉片",t:"protein",p:"pork",c:"green",lv:"A",min:12,dev:[],cuis:["sichuan"],
 steps:["莴笋去皮切薄片，猪肉切薄片用一点生抽抓匀","锅里少油，肉片滑散到变色盛出","下莴笋片大火炒 1 分钟","倒回肉片，加盐炒匀出锅"],
 note:"莴笋脆的时候最好吃，别炒久。成都人家的家常菜，孩子也吃。"},
{id:"fanqie-wanzi-tang",n:"番茄圆子汤",t:"soup",p:"soup",c:"red",lv:"A",min:20,dev:[],cuis:["sichuan"],
 steps:["肉末加姜末、盐、一点淀粉，顺一个方向搅上劲","番茄切块炒出汁，加两碗水烧开","用勺子把肉馅舀成小丸子下锅","丸子浮起来再煮 2 分钟，加盐"],
 note:"丸子小一点熟得快、孩子好入口。番茄先炒出汁，汤才红。"},
{id:"saozi-zhengdan",n:"臊子蒸蛋",t:"protein",p:"egg",c:"yellow",lv:"A",min:15,dev:["steamer"],cuis:["sichuan"],
 steps:["三个鸡蛋打散，加一倍半的温水，过筛去泡","盖一层保鲜膜或盘子，上锅中小火蒸 10 分钟","肉末用一点油炒散，加生抽炒香","蒸蛋出锅，把臊子浇上去"],
 note:"水温和蛋液 1.5 比 1，蒸出来才嫩。盖住是防表面起蜂窝。"},
{id:"mayi-shangshu",n:"蚂蚁上树",t:"protein",p:"pork",c:"brown",lv:"A",min:15,dev:[],cuis:["sichuan"],
 steps:["粉丝用温水泡 10 分钟，剪短一点","肉末下锅炒散，加一勺豆瓣酱炒出红油","加半碗水烧开，下粉丝","汤汁收干，撒葱花"],
 note:"粉丝剪短孩子才好夹。豆瓣酱本身咸，别再放盐。"},
{id:"sudan-dongguatang",n:"酥肉冬瓜汤",t:"soup",p:"soup",c:"white",lv:"A",min:20,dev:[],cuis:["sichuan"],
 steps:["冬瓜去皮切厚片","锅里水烧开，下冬瓜煮 8 分钟到半透明","下现成的酥肉，再煮 5 分钟","加盐、几粒花椒，撒葱花"],
 note:"酥肉买现成的，省掉起油锅这一关。冬瓜煮到透明才入味。"},
{id:"chongqing-xiaomian",n:"重庆小面",t:"staple",p:"staple",c:"red",lv:"A",min:12,dev:[],cuis:["sichuan"],
 steps:["碗里放生抽、醋、一点猪油或香油、花椒面、蒜水","冲两勺面汤把调料化开","面条和青菜一起下锅煮熟，捞进碗里","孩子那碗不放辣椒，最后撒葱花"],
 note:"调料先在碗里化开，面才拌得匀。辣不辣全看那一勺辣椒油。"},
{id:"lajiao-chaorou",n:"辣椒炒肉",t:"protein",p:"pork",c:"green",lv:"A",min:12,dev:[],cuis:["sichuan"],
 steps:["螺丝椒斜切片，五花肉或前腿肉切薄片","锅里不放油，先把辣椒干煸到起虎皮盛出","下肉片炒出油，加豆豉、生抽","倒回辣椒，大火翻 30 秒出锅"],
 note:"辣椒先干煸才香。孩子吃不了辣，就先把肉盛出来再放辣椒。"},
{id:"zisu-jianhuanggua",n:"紫苏煎黄瓜",t:"veg",p:"veg",c:"green",lv:"A",min:10,dev:[],cuis:["sichuan"],
 steps:["黄瓜切厚片，紫苏叶洗净撕碎","平底锅少油，黄瓜两面各煎 1 分钟","下紫苏、蒜末，加生抽翻匀","淋一点水焖 30 秒出锅"],
 note:"黄瓜煎过比炒的香。紫苏在湖南菜市场很常见，一把就够。"},
{id:"suandoujiao-roumo",n:"酸豆角炒肉末",t:"protein",p:"pork",c:"brown",lv:"A",min:12,dev:[],cuis:["sichuan"],
 steps:["酸豆角冲洗一下切小段，挤干水","肉末下锅炒散到变色","下酸豆角、一点干辣椒炒 2 分钟","加半勺糖中和酸味，出锅"],
 note:"酸豆角本身很咸，先冲一遍。拌饭一绝，孩子能吃两碗。"},
{id:"lianou-paigu-tang",n:"莲藕排骨汤",t:"soup",p:"soup",c:"white",lv:"A",min:45,dev:["pressure"],cuis:["sichuan"],
 steps:["排骨冷水下锅焯一遍，冲净浮沫","莲藕去皮切滚刀块","连姜片一起放进压力锅，水没过料","上汽后 25 分钟，开盖加盐"],
 note:"湖北人家里最常见的一锅。粉藕炖出来发糯，脆藕适合炒。"},
{id:"reganmian",n:"热干面",t:"staple",p:"staple",c:"brown",lv:"A",min:12,dev:[],cuis:["sichuan"],
 steps:["芝麻酱用温水一点点澥开，调到能流动","加生抽、一点卤水或老抽、香油拌匀","碱面下锅煮到断生就捞，别煮软","浇芝麻酱，撒萝卜丁、葱花，拌开吃"],
 note:"芝麻酱一定要澥开，直接浇会坨成一团。武汉人的早饭，中午吃也顶饱。"},
{id:"ciba-yu",n:"糍粑鱼",t:"protein",p:"fish",c:"brown",lv:"A",min:25,dev:[],cuis:["sichuan"],
 steps:["草鱼中段切块，用盐、姜、料酒腌 10 分钟","擦干水，薄薄拍一层淀粉","平底锅多放点油，中小火两面煎到金黄","下姜蒜、干辣椒、一点生抽，翻匀出锅"],
 note:"鱼块煎之前一定擦干，不然粘锅。刺少的中段给孩子吃。"},

/* ---------- 江浙沪 ---------- */
{id:"shizitou",n:"红烧狮子头",t:"protein",p:"pork",c:"brown",lv:"A",min:45,dev:[],cuis:["jiangzhe"],
 steps:["肉末里加姜末、一个鸡蛋、两勺淀粉、一勺生抽，顺一个方向搅到起胶","分三次加三勺葱姜水，每次都搅到吸收","手上抹水，把肉团成大丸子，两手来回摔打十几下","锅里少油把丸子两面煎定型，加生抽、冰糖和热水，小火炖 30 分钟"],
 note:"肉要肥三瘦七，全瘦的做出来发柴。摔打那步别省，丸子才不散。"},
{id:"youmen-daxia",n:"油焖大虾",t:"protein",p:"shrimp",c:"red",lv:"A",min:15,dev:[],cuis:["jiangzhe"],
 steps:["大虾剪掉虾枪和虾须，从背上划开挑出虾线","锅里少油，虾下锅中火煎到两面变红，盛出","原锅下姜片葱段炒香，加一勺料酒、两勺生抽、半勺糖","倒回虾，加小半碗水焖 3 分钟，大火收汁"],
 note:"虾一定开背去虾线，不然有沙。汁收到挂在虾身上最好吃。"},
{id:"yandu-xian",n:"腌笃鲜",t:"soup",p:"soup",c:"white",lv:"A",min:45,dev:["pressure"],cuis:["jiangzhe"],
 steps:["咸肉切块，冷水下锅焯 3 分钟去咸味，捞出","鲜五花肉切块焯水冲净","咸肉、鲜肉、姜片一起放压力锅，加水没过，上汽压 20 分钟","泄压后加春笋块和百叶结，再煮 5 分钟，尝过再决定放不放盐"],
 note:"咸肉本身够咸，先尝再放盐。春天有春笋的时候做最合适。"},
{id:"youmen-sun",n:"油焖笋",t:"veg",p:"veg",c:"white",lv:"A",min:15,dev:[],cuis:["jiangzhe"],
 steps:["春笋剥壳切滚刀块，开水焯 2 分钟去涩","锅里多放点油，笋块下锅中火煎到边缘发黄","加两勺生抽、半勺糖、小半碗水","盖盖小火焖 5 分钟，开盖收汁"],
 note:"笋一定要先焯水，不然发涩。油少了不好吃，这道菜费油。"},
{id:"xuecai-maodou",n:"雪菜毛豆",t:"veg",p:"veg",c:"green",lv:"A",min:10,dev:[],cuis:["jiangzhe"],
 steps:["毛豆剥出豆米，开水焯 2 分钟捞出","雪菜切碎，挤干水分","锅里少油，雪菜下锅炒香","下毛豆翻炒 2 分钟，加少许糖，基本不用放盐"],
 note:"雪菜很咸，盐基本不用放。夏天毛豆便宜，剥好冻起来能存。"},
{id:"congyou-banmian",n:"葱油拌面",t:"staple",p:"staple",c:"brown",lv:"A",min:15,dev:[],cuis:["jiangzhe"],
 steps:["小葱洗净擦干，切成长段","冷油下葱段，小火慢慢熬到葱变焦黄发脆，捞出葱段","葱油里加两勺生抽、一勺老抽、半勺糖，小火煮开","面条煮熟捞出，浇两勺葱油汁拌开，撒上葱段"],
 note:"全程小火，葱熬糊了就苦。葱油一次多熬点，装瓶能吃一周。"},
{id:"paofan",n:"上海泡饭",t:"staple",p:"staple",c:"white",lv:"A",min:10,dev:[],cuis:["jiangzhe"],
 steps:["隔夜饭打散，倒进锅里","加两碗水，大火煮开","转小火煮 3 分钟，米粒散开就好，别煮成粥","配咸菜、腐乳或酱瓜一起吃"],
 note:"泡饭不是粥，米粒要粒粒分明。夏天没胃口的时候最合适。"},
{id:"qingcai-niangao",n:"青菜炒年糕",t:"staple",p:"staple",c:"green",lv:"A",min:15,dev:[],cuis:["jiangzhe"],
 steps:["年糕片用温水泡 10 分钟到软","青菜洗净切段，梗和叶分开","锅里少油，先下菜梗炒 1 分钟，再下年糕片","加两勺生抽、半勺糖，下菜叶翻炒到年糕变软"],
 note:"年糕容易粘锅，油要够、火别太大。买切片年糕省事。"},
{id:"zheng-yunai",n:"蒸芋艿",t:"staple",p:"staple",c:"white",lv:"A",min:25,dev:["steamer"],cuis:["jiangzhe"],
 steps:["芋艿带皮洗净，个头大的对半切开","上蒸屉，水开蒸 20 分钟","筷子能戳透就好，趁热剥皮","蘸白糖或生抽，两样都行"],
 note:"蒸的时候不用管它，正好腾出手炒菜。剥皮手痒就戴手套。"},

/* --- 杭州 / 苏州 / 南京：学生午餐版，少油少刺，做法不超过四步 --- */
{id:"pianer-chuan",n:"片儿川",t:"staple",p:"staple",c:"brown",lv:"A",min:15,dev:[],cuis:["jiangzhe"],
 steps:["瘦肉切薄片，用一点生抽抓匀；笋切片","锅里少油，肉片滑散，下笋片和雪菜炒香","加两碗水烧开","下面条煮熟，连汤盛出"],
 note:"雪菜本身咸，先尝再放盐。杭州人中午一碗就够。"},
{id:"longjing-xiaren",n:"龙井虾仁",t:"protein",p:"shrimp",c:"white",lv:"A",min:20,dev:[],cuis:["jiangzhe"],
 steps:["虾仁用一点盐、蛋清、淀粉抓匀，放 10 分钟","龙井茶用 80 度水泡开，茶叶和茶汤分开","热锅温油，虾仁滑到变色立刻盛出","倒回锅里，淋两勺茶汤、撒茶叶，翻匀出锅"],
 note:"虾仁滑到刚变色就起锅，多炒 30 秒就老。茶叶别用太浓的。"},
{id:"sungan-laoya-tang",n:"笋干老鸭汤",t:"soup",p:"soup",c:"white",lv:"A",min:60,dev:["pressure"],cuis:["jiangzhe"],
 steps:["笋干提前用温水泡 2 小时，洗净切段","老鸭斩块，冷水下锅焯一遍冲净","连姜片一起放压力锅，水没过料","上汽后 30 分钟，开盖加盐"],
 note:"笋干要泡透，不然发硬。这锅汤是杭州人夏天的底气。"},
{id:"youmianjin-sairou",n:"油面筋塞肉",t:"protein",p:"pork",c:"brown",lv:"A",min:25,dev:[],cuis:["jiangzhe"],
 steps:["肉末加姜末、生抽、一点淀粉搅上劲","油面筋用手指戳个洞，把肉馅塞进去","锅里放生抽、糖、一碗水烧开","下油面筋小火焖 12 分钟，收汁"],
 note:"塞七分满就行，肉会胀。苏州人家常做，一次多塞几个冻起来。"},
{id:"jiaobai-rousi",n:"茭白炒肉丝",t:"protein",p:"pork",c:"white",lv:"A",min:12,dev:[],cuis:["jiangzhe"],
 steps:["茭白剥壳切细丝，猪肉切丝","肉丝下锅滑散到变色盛出","下茭白丝大火炒 2 分钟","倒回肉丝，加盐炒匀"],
 note:"茭白老了芯会空，挑掂着沉的。江南夏天最嫩。"},
{id:"jimaocai-baiye",n:"鸡毛菜炒百叶",t:"veg",p:"veg",c:"green",lv:"A",min:8,dev:[],cuis:["jiangzhe"],
 steps:["鸡毛菜洗净沥干，百叶切细丝","百叶先用开水烫 1 分钟捞出","锅里少油，下鸡毛菜大火炒软","下百叶，加盐翻匀出锅"],
 note:"鸡毛菜一炒就塌，全程不超过 2 分钟。百叶先烫过才不硬。"},
{id:"yaxue-fensitang",n:"鸭血粉丝汤",t:"soup",p:"soup",c:"brown",lv:"A",min:15,dev:[],cuis:["jiangzhe"],
 steps:["鸭血切小块，用开水烫一下去腥","粉丝温水泡软，油豆腐对半切","锅里高汤或清水烧开，下鸭血、油豆腐煮 5 分钟","下粉丝煮 2 分钟，加盐、白胡椒，撒香菜"],
 note:"鸭血先烫过汤才清。南京孩子放学路上都吃过这一碗。"},
{id:"luhao-xianggan",n:"芦蒿炒香干",t:"veg",p:"veg",c:"green",lv:"A",min:10,dev:[],cuis:["jiangzhe"],
 steps:["芦蒿掐成段，去掉老根；香干切细条","锅里少油，下香干煸 1 分钟","下芦蒿大火快炒 1 分钟","加盐，翻两下出锅"],
 note:"芦蒿只吃嫩尖，老根咬不动。南京人春天的时令菜。"},
{id:"yanshuiya",n:"盐水鸭（买现成）",t:"protein",p:"chicken",c:"white",lv:"A",min:10,dev:[],cuis:["jiangzhe"],
 steps:["买现成的盐水鸭，斩块","上锅蒸 8 分钟蒸热","撒一点花椒盐，配饭直接吃"],
 note:"自己腌要两天，买现成的最省事。南京街口都有，斩半只够三个人。"},

/* ---------- 粤式家常（深圳、广州一带） ---------- */
{id:"baiqie-ji",n:"白切鸡",t:"protein",p:"chicken",c:"white",lv:"A",min:35,dev:[],cuis:["yue"],
 steps:["整鸡洗净，锅里水烧开，提着鸡颈下锅烫 10 秒提起，重复三次","整鸡下锅，水没过一半，小火浸 25 分钟，别滚","捞出立刻泡冰水 10 分钟，皮才爽","斩块，配姜葱蓉蘸着吃"],
 note:"关键是小火浸，水一滚肉就柴。冰水这一步别省。买的时候让摊主帮忙斩好，家里省一道刀工。整只吃不完，半只也行，时间减 8 分钟。"},
{id:"douchi-zhengpaigu",n:"豆豉蒸排骨",t:"protein",p:"pork",c:"brown",lv:"A",min:25,dev:["steamer"],cuis:["yue"],
 steps:["排骨斩小块，冲洗后擦干","加豆豉、蒜末、生抽、一点淀粉抓匀，腌 15 分钟","上蒸屉，水开蒸 18 分钟","撒葱花，端上桌"],
 note:"排骨切小才蒸得透。腌的时候放淀粉，蒸出来才滑。"},
{id:"suanrong-caixin",n:"蒜蓉炒菜心",t:"veg",p:"veg",c:"green",lv:"A",min:8,dev:[],cuis:["yue"],
 steps:["菜心洗净，梗粗的从中间划开","蒜切末，一半下锅小火爆香","菜心下锅大火炒 1 分钟，淋一勺水","加盐和剩下的生蒜，翻匀出锅"],
 note:"广东人一天不吃青菜就算没吃饭。菜心别炒黄。"},
{id:"douchi-lingyu-youcai",n:"豆豉鲮鱼油麦菜",t:"veg",p:"veg",c:"green",lv:"A",min:10,dev:[],cuis:["yue"],
 steps:["油麦菜洗净掐段，罐头鲮鱼撕小块","锅里少油，下鲮鱼和豆豉炒香","下油麦菜大火炒软","不用放盐，罐头本身够咸"],
 note:"罐头里的油一起倒进去，特别香。上班族回家十分钟能上桌。"},
{id:"donggua-yimi-tang",n:"冬瓜薏米排骨汤",t:"soup",p:"soup",c:"white",lv:"A",min:60,dev:["pressure"],cuis:["yue"],
 steps:["薏米提前泡 30 分钟，排骨焯水冲净","冬瓜去皮切大块","排骨、薏米、姜片放压力锅，水没过","上汽 25 分钟，开盖下冬瓜再煮 10 分钟"],
 note:"冬瓜后放，不然炖化了。广东的汤讲清甜，盐最后放。"},
{id:"bai-zhou",n:"白粥",t:"staple",p:"staple",c:"white",lv:"A",min:40,dev:[],cuis:["yue"],
 steps:["大米淘净，加一小勺油拌匀，泡 20 分钟","水比平时煮饭多八倍，烧开下米","小火煮 30 分钟，中途搅两次","关火焖 5 分钟，配小菜吃"],
 note:"米先用油拌过，粥才绵。广东人配咸菜、腐乳、煎蛋都行。"},
{id:"youyan-fan",n:"油盐饭",t:"staple",p:"staple",c:"white",lv:"A",min:30,dev:[],cuis:["yue"],
 steps:["大米淘净，水量比平时少一点点","加半勺油、一点盐、几片姜，拌匀","电饭锅标准档，跳闸后焖 10 分钟","拌匀盛出，配菜吃"],
 note:"最省事的一锅饭，米粒油亮。孩子不爱吃白饭的时候可以试试。"},
{id:"ganchao-niuhe",n:"干炒牛河",t:"staple",p:"staple",c:"brown",lv:"A",min:15,dev:[],cuis:["yue"],
 steps:["河粉提前用手轻轻抖散，别弄断","牛肉切薄片，用生抽、淀粉抓匀","热锅多油，牛肉滑散盛出","下河粉摊开煎香，加生抽、豆芽、牛肉，翻匀出锅"],
 note:"河粉下锅别急着翻，先煎香再动。锅要够热，不然粘成一团。用不粘锅、拿铲子轻推就行，不用颠锅。"},
{id:"xianyu-jili-chaofan",n:"咸鱼鸡粒炒饭",t:"staple",p:"staple",c:"brown",lv:"A",min:15,dev:[],cuis:["yue"],
 steps:["鸡腿肉切小粒，用生抽、淀粉抓匀","咸鱼切碎，小火煸香盛出","下鸡粒炒熟，倒隔夜饭炒散","加咸鱼、葱花，炒到饭粒跳动"],
 note:"隔夜饭才炒得散。咸鱼很咸，盐就别放了。"},

/* ---------- 全国通用 ---------- */
{id:"xiaomi-zhou",n:"小米粥",t:"staple",p:"staple",c:"yellow",lv:"A",min:25,dev:[],
 steps:["小米淘两遍，别用手搓，搓了不香","锅里水烧开再下小米，边下边搅","小火煮 20 分钟，中途搅两三次防糊底","关火焖 5 分钟，表面会结一层米油"],
 note:"水开下米不糊底。想稠少放水，想稀多放水。配咸菜、腐乳都行。"}

/* 老数据补字段。老用户当初进来的就是河南版，别让他们一升级看到菜单全变了。 */
function mig(m,raw){
  raw=raw||{};
  if(typeof raw.adults!=="number"||typeof raw.kids!=="number"){
    var p=Math.max(1,Math.round(+raw.people||3));
    m.kids=Math.max(0,Math.min(2,p-2));
    m.adults=Math.max(1,p-m.kids);
  }
  if(!raw.area)m.area="north";
  /* 河南菜路已并入北方，老用户跟着搬过去，别留在不存在的地区上 */
  if(m.area==="henan")m.area="north";

     而不是硬编码北方——已经在用川渝湘鄂的人不该被降级 */
  if(typeof raw.regen!=="number")m.regen=FREE_REGEN;
  if(!raw.areaFree)m.areaFree=m.area;
  if(!raw.wcache||typeof raw.wcache!=="object")m.wcache={};
  /* 有存过任何东西就是老用户，不弹引导；全新的才走四步 */
  if(raw.onboarded===undefined)m.onboarded=!!(raw.week||raw.people||raw.serve||raw.area);
  if(!m.people)m.people=(+m.adults||0)+(+m.kids||0)||3;
  return m;
}

  if(!(typeof crypto!=="undefined"&&crypto.subtle)){LIC_ON=false;return Promise.resolve(false);}
  return licVerify(S.lic).then(function(ok){
    LIC_ON=!!ok;
    if(!ok){S.lic="";save();}
    return LIC_ON;
  });
}
function licOn(){return LIC_ON;}
function regenLeft(){
  var n=S.regen;
  return (typeof n==="number")?Math.max(0,n):FREE_REGEN;
}
/* 只有人主动点「重新排一周」才扣次数；跨周自动重排不扣，否则一个月就耗光、产品变砖 */
function spendRegen(){
  if(LIC_ON)return true;
  var n=regenLeft();
  if(n<=0)return false;
  S.regen=n-1;save();
  return true;
}
function canArea(a){
  /* 老人那端（RO）不拦：他手机上点不出付费提示，切了也不会重排，无所谓 */
  if(LIC_ON||RO)return true;
  if(!S.areaFree)return true;
  return a===S.areaFree;
}
function canCopy(){return LIC_ON;}
function payTip(){
  toast("文字导出是完整版的功能。到「设置」最下面输入激活码就能用");
}
function byId(id){for(var i=0;i<DISHES.length;i++){if(DISHES[i].id===id)return DISHES[i];}return null;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function dayN(){return 864e5;}
function iso(d){var y=d.getFullYear(),m=("0"+(d.getMonth()+1)).slice(-2),dd=("0"+d.getDate()).slice(-2);return y+"-"+m+"-"+dd;}
function mondayOf(d){var x=new Date(d.getTime());var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x;}
function parseISO(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}

/* ---------- 这一周是哪一周：周末默认看下周 ----------
   只排周一到周五。周六周日打开时，用户真正要的是「下周一吃什么、下周买什么」，
   所以周末直接把下周排好；等到周一打开，日期已经对上，不会重排，
   周日看好的菜单能接着用（这正是以前最别扭的地方：周一零点偷偷换掉）。 */
function isWeekend(){var g=new Date().getDay();return g===0||g===6;}
function idealMon(){
  var g=new Date().getDay(),m=mondayOf(new Date());
  if(g===0||g===6)m=new Date(m.getTime()+7*dayN());
  return m;
}
function weekMon(){return (S.week&&S.week.length)?mondayOf(parseISO(S.week[0].date)):null;}
function weekDiff(){
  var w=weekMon();if(!w)return 0;
  return Math.round((w.getTime()-mondayOf(new Date()).getTime())/(7*dayN()));
}
/* 切到某一周：缓存里有就直接用，没有才排；排过的不会再排第二遍 */
function setWeek(mon){
  var key=iso(mon),cur=weekMon();
  if(!S.wcache)S.wcache={};
  if(cur&&S.week&&S.week.length)S.wcache[iso(cur)]=S.week;
  var cached=S.wcache[key];
  if(cached&&cached.length){S.week=cached;save();render();return false;}
  generate(mon);
  save();
  return true;
}
function gapDays(id){var h=S.hist[id];if(!h||!h.last)return 999;return Math.round((Date.now()-parseISO(h.last).getTime())/dayN());}
function isCold(id){
  var h=S.hist[id];if(!h)return false;
  var g=gapDays(id);
  /* 冷却 14 天而不是 30 天：新食物要 8-15 次接触才被接受，关太久等于永久踢出 */
  if((h.no||0)>=2&&g<14)return true;
  if((S.pref[id]||0)<=-4&&g<14)return true;
  return false;
}
function portion(){
  if(S.age==="3-5")return "主食半碗到一拳头，菜一手捧起来，肉半巴掌心";
  if(S.age==="11-13")return "主食一拳半，菜两手捧满，肉一巴掌半";
  return "主食一拳头，菜两手捧起来，肉一巴掌心大小和厚度";
}
function hands(x){return Math.round(x.min<=15?x.min:15+(x.min-15)*0.35);}
function dayMinutes(d){
  var psv=0,act=0,n=0;
  ["protein","veg1","veg2","soup","staple"].forEach(function(k){
    var x=byId(d[k]);if(!x)return;
    if(x.psv){if(x.min>psv)psv=x.min;}else{act+=hands(x);n++;}
  });
  /* 和「今天」那页用同一套备菜估法，避免两处数字打架 */
  act+=Math.min(12,5+n*2);
  return {total:Math.round(Math.max(psv,act)),active:Math.round(act),passive:Math.round(psv)};
}
/* 没打 cuis 的菜是全国通用，哪个地区都排；打了的只在标到的地区出现 */
function cuisOK(d){
  if(!d.cuis)return true;
  return d.cuis.indexOf(S.area||"north")>=0;
}
function cuisTag(d){
  if(!d.cuis)return "";
  for(var i=0;i<d.cuis.length;i++){if(CUIS_LABEL[d.cuis[i]])return CUIS_LABEL[d.cuis[i]];}
  return "";
}
function normArea(a){
  for(var i=0;i<AREAS.length;i++){if(AREAS[i][0]===a)return a;}
  return "north";
}
/* 某个菜路能用多少道菜（通用菜 + 该地区菜），设置页和文案都靠它，别写死 */
function libCount(a){
  var c=0;
  for(var i=0;i<DISHES.length;i++){
    var d=DISHES[i];
    if(!d.cuis||d.cuis.indexOf(a)>=0)c++;
  }
  return c;
}
function areaName(){
  var a=normArea(S.area);
  for(var i=0;i<AREAS.length;i++){if(AREAS[i][0]===a)return AREAS[i][1];}
  return "北方家常";
}
function pool(t,loose){
  var out=[];
  for(var i=0;i<DISHES.length;i++){
    var d=DISHES[i];
    if(d.t!==t)continue;
    if(S.enabled[d.id]===false)continue;
    if(!loose&&!cuisOK(d))continue;
    if(isCold(d.id))continue;
    if(d.p!=="veg"&&d.p!=="staple"&&d.p!=="soup"&&S.avoid.indexOf(d.p)>=0)continue;
    var okDev=true;
    for(var j=0;j<d.dev.length;j++){if(S.dev.indexOf(d.dev[j])<0){okDev=false;break;}}
    if(!okDev)continue;
    out.push(d);
  }
  /* 兜底：某个地区把这个品类筛空了，就退回全国通用，总比排不出菜单强 */
  if(!out.length&&!loose)return pool(t,true);
  return out;
}
function scoreOf(d,now,usedWeek){
  var s=(S.pref[d.id]||0)*2.2;
  var g=gapDays(d.id);
  if(g<7)s-=6;else if(g<14)s-=2.2;else if(g<21)s-=1;
  /* 本地菜加权：优先排本地口味，不然选了河南也吃不出一周河南味。
     但只在「两周以上没出现」时才抬——常开的话，一道本地菜会靠 +2.5
     每周都压过上周没吃过的菜，变成每周固定出现，跟「不重样」自相矛盾。
     主食不给加成：它已经有「一周不重样」和形态轮换两道约束了。 */
  if(d.t!=="staple"&&g>=14&&d.cuis&&d.cuis.indexOf(S.area||"north")>=0)s+=2.5;
  if(usedWeek[d.id])s-=20;
  return s;
}
function rank(list,now,usedWeek){
  var arr=[];
  for(var i=0;i<list.length;i++){arr.push({d:list[i],s:scoreOf(list[i],now,usedWeek)+(Math.random()-0.5)*2.6});}
  arr.sort(function(a,b){return b.s-a.s;});
  return arr;
}
/* 形态从主食推出来：不是随机贴标签，而是这顿饭实际怎么吃 */
function formFor(stapleId,soupId,proteinId){
  var s=byId(stapleId);
  if(!s)return "菜饭同盘";
  if(s.full)return "一锅出，端上来就能吃";
  var k=SKIND[s.id]||"rice";
  if(k==="rice"){
    if(soupId)return "汤泡饭";
    var p=byId(proteinId);
    if(p&&(p.c==="brown"||p.c==="red"))return "盖饭";
    if(p&&(p.c==="green"||p.c==="white"))return "饭菜分开，自己配";
    return "菜饭同盘";
  }
  if(k==="noodle")return "面和卤分开，拌着吃";
  if(k==="mixed")return "调料在碗底，拌开就吃";
  if(k==="bun")return "馒头掰开夹菜";
  if(k==="bing")return "卷着吃，自己动手";
  if(k==="root")return "当点心配着菜吃";
  if(k==="porridge")return "稀的配干的，就着菜吃";
  return "菜饭同盘";
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function pick(list,now,usedWeek){if(!list.length)return null;return rank(list,now,usedWeek)[0].d;}

function generate(baseMon){
  var mon=baseMon?mondayOf(baseMon):mondayOf(new Date()),now=Date.now();
  var used={},weekP={},weekV={},week=[];
  var labels=["周一","周二","周三","周四","周五"];
  var order=shuffle([0,1,2,3,4]);

  /* 一锅出的主食一周 1-2 天，其余排米饭类，保证不连着一周吃面 */
  var onePotN=Math.random()<0.55?1:2;
  var onePotDay={};
  for(var q=0;q<onePotN;q++){onePotDay[order[q]]=1;}

  /* 汤：在不是一锅出的日子里挑两天 */
  var free=[];
  for(var f=0;f<order.length;f++){if(!onePotDay[order[f]])free.push(order[f]);}
  var soupDay={};
  if(free[0]!==undefined)soupDay[free[0]]=1;
  if(free[1]!==undefined)soupDay[free[1]]=1;

  /* 新菜不能落在一锅出那天：一锅出不配主菜，新菜就白排了 */
  var newDay=-1;
  for(var nd=0;nd<order.length;nd++){if(!onePotDay[order[nd]]){newDay=order[nd];break;}}
  if(newDay<0)newDay=order[0];

  /* 鱼和豆制品各排一次：只能落在非一锅出、非新菜的日子 */
  var quota=[];
  for(var oi=0;oi<order.length;oi++){
    var qi=order[oi];
    if(onePotDay[qi]||qi===newDay)continue;
    quota.push(qi);
  }
  var fishDay=quota[0],tofuDay=quota[1];

  /* 新菜候选：B 级且 9 天没出现，多个里随机挑一个 */
  var newCandidate=null,ncPool=[];
  var bp=pool("protein");
  for(var i=0;i<bp.length;i++){var d=bp[i];if(d.lv!=="B")continue;if(gapDays(d.id)>=9)ncPool.push(d);}
  if(ncPool.length)newCandidate=ncPool[Math.floor(Math.random()*ncPool.length)];

  for(var k=0;k<5;k++){
    var dt=new Date(mon.getTime()+k*dayN());
    var p=null;

    if(k===newDay&&newCandidate){
      p=newCandidate;
    }else{
      var wantP=(k===fishDay)?"fish":((k===tofuDay)?"tofu":"");
      var cands=pool("protein"),cp=[];
      for(var a=0;a<cands.length;a++){
        var c=cands[a];
        if(c===newCandidate)continue;
        if(used[c.id])continue;
        if((weekP[c.p]||0)>=2)continue;
        if(wantP&&c.p!==wantP)continue;
        cp.push(c);
      }
      if(!cp.length&&wantP){
        for(a=0;a<cands.length;a++){
          var c2=cands[a];
          if(c2===newCandidate||used[c2.id])continue;
          if((weekP[c2.p]||0)<2)cp.push(c2);
        }
      }
      p=pick(cp,now,used);
    }

    if(!p){
      var fall=[],fp=pool("protein");
      for(a=0;a<fp.length;a++){if(fp[a]!==newCandidate&&!used[fp[a].id])fall.push(fp[a]);}
      p=pick(fall,now,used);
    }
    if(!p){var ap=pool("protein");p=ap[0];}
    if(!p)break;

    used[p.id]=1;weekP[p.p]=(weekP[p.p]||0)+1;

    /* 蔬菜：一个绿叶 + 一个其他颜色 */
    var greens=[],others=[];
    var vs=pool("veg");
    for(var b=0;b<vs.length;b++){
      var v=vs[b];
      if(used[v.id])continue;
      if((weekV[v.id]||0)>=1)continue;
      if(v.c==="green")greens.push(v);else others.push(v);
    }
    var v1=pick(greens.length?greens:vs,now,used);
    if(v1){used[v1.id]=1;weekV[v1.id]=1;}
    var v2=pick(others,now,used);
    if(v2){used[v2.id]=1;weekV[v2.id]=1;}

    /* 主食：按一锅出 / 米饭类分开排，一周不重复 */
    var stAll=pool("staple"),stFree=[];
    for(var si=0;si<stAll.length;si++){
      var st=stAll[si];
      if(used[st.id])continue;
      if(!!ONEPOT[st.id]!==!!onePotDay[k])continue;
      stFree.push(st);
    }
    if(!stFree.length){
      for(si=0;si<stAll.length;si++){if(!used[stAll[si].id])stFree.push(stAll[si]);}
    }
    var sp=pick(stFree.length?stFree:stAll,now,used);
    if(sp)used[sp.id]=1;

    /* 汤 */
    var soup=null;
    if(soupDay[k]){
      var su=[],sus=pool("soup");
      for(var r=0;r<sus.length;r++){if(!used[sus[r].id])su.push(sus[r]);}
      soup=pick(su,now,used);
      if(soup)used[soup.id]=1;
    }

    var day={date:iso(dt),label:labels[k],form:"",
      protein:p?p.id:"",veg1:v1?v1.id:"",veg2:v2?v2.id:"",soup:soup?soup.id:"",
      staple:sp?sp.id:"",isNew:!!(newCandidate&&p&&p.id===newCandidate.id),fb:{}};

    if(sp&&ONEPOT[sp.id]){
      /* 一锅出本身就是一荤一素一主食，主菜、第二个菜、汤都不要再配 */
      day.protein="";day.veg2="";day.soup="";day.isNew=false;
      /* 但这三格前面已经挑过、也占了名额（鱼和豆制品每周各一次、蔬菜一周不重样）。
         占了却不上桌，就等于把这周的配额白吃一口——实测约 0.3% 的周会因此排不出鱼。
         既然不上桌，名额和去重标记都还回去。 */
      if(p){if(used[p.id])used[p.id]=0;weekP[p.p]=Math.max(0,(weekP[p.p]||0)-1);}
      if(v2){if(used[v2.id])used[v2.id]=0;weekV[v2.id]=0;}
      if(soup){if(used[soup.id])used[soup.id]=0;}
    }
    else{
      if(dayMinutes(day).active>50)day.soup="";
      if(dayMinutes(day).active>50)day.veg2="";
    }
    day.form=formFor(day.staple,day.soup,day.protein);
    week.push(day);
  }

  S.week=week;
  /* 顺手记进缓存：只留上周/本周/下周三条，不让它无限长 */
  if(!S.wcache)S.wcache={};
  var keep={};keep[iso(mon)]=week;
  var pm=iso(new Date(mon.getTime()-7*dayN())),nm=iso(new Date(mon.getTime()+7*dayN()));
  if(S.wcache[pm])keep[pm]=S.wcache[pm];
  if(S.wcache[nm])keep[nm]=S.wcache[nm];
  S.wcache=keep;
  var today=iso(new Date());
  week.forEach(function(dd){
    ["protein","veg1","veg2","soup","staple"].forEach(function(kk){
      if(!dd[kk])return;
      var h=S.hist[dd[kk]]||(S.hist[dd[kk]]={no:0});
      h.last=today;
    });
  });
  S.tick={};S.shop={};
  save();render();
}

function buildShop(){
  var agg={};
  (S.week||[]).forEach(function(day){
    ["protein","veg1","veg2","soup","staple"].forEach(function(k){
      var items=ING[day[k]];if(!items)return;
      items.forEach(function(it){
        var key=it[3]+"|"+it[0]+"|"+it[2];
        if(!agg[key])agg[key]={n:it[0],u:it[2],c:it[3],q:0};
        agg[key].q+=it[1];
      });
    });
  });
  var out={};
  for(var k in agg){var a=agg[k];(out[a.c]=out[a.c]||[]).push(a);}
  for(var c in out){out[c].sort(function(x,y){return y.q-x.q;});}
  return out;
}
function fmtQ(a){
  var x=a.q*(S.people||3)/3;
  if(a.u==="克"){x=Math.max(50,Math.round(x/50)*50);return x+" 克";}
  if(a.u==="毫升"){x=Math.max(50,Math.round(x/50)*50);return x+" 毫升";}
  return Math.max(1,Math.ceil(x))+" "+a.u;
}

function toMin(s){var p=(s||"12:00").split(":");return (+p[0])*60+(+p[1]||0);}
function hm(m){m=((Math.round(m)%1440)+1440)%1440;var h=Math.floor(m/60),mi=m%60;return (h<10?"0":"")+h+":"+(mi<10?"0":"")+mi;}
function timeline(day){
  var serve=toMin(S.serve);
  var all=[];
  ["protein","veg1","veg2","soup","staple"].forEach(function(k){var d=byId(day[k]);if(d)all.push(d);});
  if(!all.length)return {items:[{t:serve,n:"开饭",d:0,serve:true}],start:serve,total:0,serve:serve};

  var elec=all.filter(function(d){return d.psv;});
  var stove=all.filter(function(d){return !d.psv;});

  /* 灶上顺序：先烧水（水开前正好切下一道的料），再耗时长的，快手菜收尾 */
  stove.sort(function(a,b){
    var ba=a.boil?1:0,bb=b.boil?1:0;
    if(ba!==bb)return bb-ba;
    return hands(b)-hands(a);
  });

  var prep=Math.min(12,5+stove.length*2);
  var cookSum=0;
  stove.forEach(function(d){cookSum+=hands(d);});
  /* 炒菜段锚定开饭时间，保证菜是热的；洗切紧贴它之前 */
  var cookStart=serve-5-cookSum;
  var prepStart=cookStart-prep;

  var items=[];
  /* 电器倒推它该上锅的时刻；如果需要比洗切还早，就先上锅再洗切 */
  elec.forEach(function(d){
    items.push({t:Math.min(serve-5-d.min,prepStart-1),n:d.n+" 上锅",d:d.min,passive:true,
      sub:"先上锅，再洗切；这一段不用看着"});
  });
  items.push({t:prepStart,n:"洗菜、切菜、把料摆好",d:prep,
    sub:(stove.length&&stove[0].boil)?"先把水烧上":"料摆好再开火"});

  var cur=cookStart;
  stove.forEach(function(d,i){
    var sub="";
    if(d.boil)sub="水开前把这道的料切好";
    else if(i===stove.length-1)sub="最后一道，炒完直接上桌";
    items.push({t:cur,n:d.n,d:hands(d),id:d.id,sub:sub});
    cur+=hands(d);
  });

  items.push({t:serve,n:"开饭",d:0,serve:true});
  items.sort(function(a,b){return a.t-b.t;});

  var start=items[0].t;
  return {items:items,start:start,total:serve-start,serve:serve,prep:prep,stoveSum:prep+cookSum};
}
function todayIndex(){
  var t=iso(new Date());
  for(var i=0;i<(S.week||[]).length;i++){if(S.week[i].date===t)return i;}
  return -1;
}

function renderWeek(){
  var el=document.getElementById("v-week");
  if(!S.week||!S.week.length){
    el.innerHTML='<div class="empty">还没排过。点上面「重新排一周」。</div>';

      (d.soup?dishRow(d.soup,"",i):"")+

function renderToday(){
  var el=document.getElementById("v-today");
  if(!S.week||!S.week.length){el.innerHTML='<div class="empty">还没排过。先去「本周」点重新排一周。</div>';return;}
  var ti=todayIndex(),preview=false;
  if(ti<0){ti=0;preview=true;}
  var day=S.week[ti],tl=timeline(day);
  /* 今天不在排程里时，把「为什么不是今天」说清楚：周末就给下周一，别让人以为日期错了 */
  var note="";
  if(preview){
    var df=weekDiff();
    if(isWeekend()&&df===1)note=" · 今天周末，先看下周这天的安排";
    else if(df===1)note=" · 这是下周的安排";
    else if(df===-1)note=" · 这周已经过完了";
    else note=" · 今天不在排程里，先看这天的流程";
  }
  var now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
  var h='<div class="tl-hero"><div class="big">'+day.label+' · '+S.serve+' 开饭</div>'+
    '<div class="meta">'+day.date+' · '+hm(tl.start)+' 开始动手，全程 '+Math.round(tl.total)+' 分钟，其中站在灶前约 '+Math.round(tl.stoveSum||0)+' 分钟'+
    note+'</div>';
  if(!preview&&nowMin>tl.start&&nowMin<toMin(S.serve)){
    h+='<div class="warnline">现在 '+hm(nowMin)+' 了，按计划 '+hm(tl.start)+' 就该动手，先去把菜洗了。</div>';
  }
  h+='</div>';

  h+='<div class="card"><ul class="tl">';
  tl.items.forEach(function(it,idx){
    var key=day.date+"|"+idx,done=!!S.tick[key];
    var rel=tl.items[tl.items.length-1].t-it.t;
    var lead=(!it.serve&&rel>0)?"开饭前 "+rel+" 分钟":"";
    var rest=[];
    if(it.d)rest.push("约 "+it.d+" 分钟");
    if(it.passive)rest.push("电器并行，不占人");
    if(it.sub)rest.push(it.sub);
    /* 大字模式：老人只要「还有多少时间动这道」，把这句单独一行放大，其余压到第二行 */
    var metaHtml="";
    if(S.elder){
      metaHtml=(lead?'<span class="d d-lead">'+esc(lead)+'</span>':'')+
        (rest.length?'<span class="d">'+esc(rest.join(" · "))+'</span>':'');
    }else{
      var all=lead?[lead].concat(rest):rest;
      metaHtml=all.length?'<span class="d">'+esc(all.join(" · "))+'</span>':'';
    }
    h+='<li class="'+(it.serve?'serve ':'')+(it.passive?'passive ':'')+(done?'done':'')+'">'+
      '<span class="t">'+hm(it.t)+'</span>'+
      '<span class="b"><span class="n">'+esc(it.n)+'</span>'+metaHtml+'</span>'+
      '<button class="tick" data-tick="'+key+'" type="button" aria-label="标记这一步完成">✓</button>'+
      '</li>';
  });
  h+='</ul></div>';

  h+='<h2>今天这几道，问一句孩子</h2><div class="card">'+
    dishRow(day.protein,day.isNew?"new":"",ti)+
    dishRow(day.veg1,"",ti)+
    (day.veg2?dishRow(day.veg2,"",ti):"")+
    (day.soup?dishRow(day.soup,"",ti):"")+
    dishRow(day.staple,"",ti)+'</div>';

  if(!RO)h+='<div class="bar"><button class="btn" data-copytoday="1" type="button">把流程发给做饭的人</button></div>';
  el.innerHTML=h;
}

function copyText(t){
  var done=function(){toast("已复制，去微信粘贴");};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done,function(){fallback(t);});
      return;
    }
  }catch(e){}
  fallback(t);
}
function fallback(t){
  var ok=false;
  try{
    var ta=document.createElement("textarea");
    ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    ok=document.execCommand("copy");
    document.body.removeChild(ta);
  }catch(e){ok=false;}
  if(ok){toast("已复制，去微信粘贴");return;}
  manualCopy(t);
}
/* 本地文件打开时浏览器不给剪贴板权限，只能让用户长按复制 */
function manualCopy(t){
  document.getElementById("sheetBody").innerHTML=
    '<p class="sh-title">手动复制</p>'+

    '<textarea id="mcBox" readonly style="width:100%;height:44vh;font:14px/1.7 inherit;padding:12px;border:1px solid var(--line);border-radius:10px;resize:none;background:var(--bg);color:var(--ink)">'+esc(t)+'</textarea>'+
    '<div class="sh-actions"><button class="btn" data-close="1" type="button">好了</button></div>';
  var dlg=document.getElementById("sheet");
  if(dlg&&dlg.showModal&&!dlg.open)dlg.showModal();

  var box=document.getElementById("mcBox");

function vote(id,i,val){
  var day=S.week[i];if(!day)return;
  var fb=day.fb||(day.fb={});
  if(fb[id]===val){delete fb[id];}
  else{fb[id]=val;}
  var h=S.hist[id]||(S.hist[id]={no:0});
  var cur=S.pref[id]||0;
  if(fb[id]==="want"){S.pref[id]=Math.min(cur+1,5);h.no=0;}
  else if(fb[id]==="no"){S.pref[id]=Math.max(cur-2,-5);h.no=(h.no||0)+1;h.last=iso(new Date());}
  else if(fb[id]==="ok"){S.pref[id]=cur>0?cur-1:(cur<0?cur+1:0);h.no=0;}
  save();renderWeek();renderToday();renderLib();
}

function exportData(){
  try{

    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download="lunchcard-backup.json";

function importData(file){
  try{
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(String(r.result));
        if(!o||typeof o!=="object")throw new Error("bad");
        S=Object.assign(JSON.parse(JSON.stringify(DEF)),o);
        save();render();toast("导入成功");
      }catch(e){toast("文件读不出来，可能不是备份文件");}
    };
    r.readAsText(file);
  }catch(e){toast("导入失败");}
}

/* ---------- 把这一周塞进网址，发给家人 ----------
   每台手机的排程都是各自随机的，同一周看到的是七顿不同的饭。
   所以「发个链接过去」必须把菜单本身带上，否则老人和妈妈看的两套。 */
function b64e(s){return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function b64d(s){
  var t=String(s).replace(/-/g,"+").replace(/_/g,"/");
  while(t.length%4)t+="=";
  return atob(t);
}
function sharePayload(){
  var w=(S.week||[]).map(function(d){
    return [d.date,d.protein||"",d.veg1||"",d.veg2||"",d.soup||"",d.staple||"",d.isNew?1:0];
  });
  return {v:2,a:S.age,p:S.people,s:S.serve,r:S.area,w:w};
}
function shareLink(){
  if(location.protocol==="file:"){toast("本地文件只能在这台机器上看，先放到网上再分享");return "";}
  if(!S.week||!S.week.length){toast("先排一周再分享");return "";}
  return location.origin+location.pathname+"#m="+b64e(JSON.stringify(sharePayload()));
}
/* applyHash 失败时把原因写在 hashWhy 里，交给 init 说一句人话。
   沉默返回 false 的话，家人点开过期链接会直接撞上引导页，没人解释得清。 */
var hashWhy="";
function applyHash(){
  hashWhy="";
  var h=location.hash||"";
  if(h.indexOf("#m=")!==0)return false;
  var o;
  try{o=JSON.parse(b64d(h.slice(3)));}catch(e){hashWhy="broken";return false;}
  if(!o||!o.w||!o.w.length){hashWhy="broken";return false;}

  /* 链接会被存成主屏幕图标，一直带着 #m=。
     如果不管日期就照单全收，家人会永远停在被分享的那一周。
     只认「本周」和「下周一」（周日晚上提前发给家人），过期就交回本地重排。 */
  var first=(o.w[0]||[])[0];
  if(!first){hashWhy="broken";return false;}
  var sMon=mondayOf(parseISO(first)),tMon=mondayOf(new Date());
  var gapW=Math.round((sMon.getTime()-tMon.getTime())/(7*dayN()));
  if(gapW<0||gapW>1){hashWhy="stale";return false;}

  var names=["周一","周二","周三","周四","周五","周六","周日"];
  var week=[];
  for(var i=0;i<o.w.length&&i<7;i++){
    var r=o.w[i]||[];
    var fix=function(x){return (x&&byId(x))?x:"";};
    var day={date:r[0]||"",label:names[i],
      protein:fix(r[1]),veg1:fix(r[2]),veg2:fix(r[3]),soup:fix(r[4]),staple:fix(r[5]),
      isNew:!!r[6],fb:{},form:""};
    day.form=formFor(day.staple,day.soup,day.protein);
    week.push(day);
  }
  if(!week.length){hashWhy="broken";return false;}
  S.week=week;
  if(o.p)S.people=+o.p||S.people;
  if(o.s)S.serve=o.s;
  if(o.a)S.age=o.a;
  if(o.r)S.area=o.r;
  S.tick={};S.shop={};
  save();
  return true;
}
function hashFail(){return hashWhy;}

/* ---------- 初次设置：四步问完，直接排出一周 ----------
   第一次打开的人看见空菜单不知道从哪下手，所以先问四个问题再排，
   问完立刻给出「排好了」和三组数字，比直接甩一张空表有用。 */
var OB={i:0,pick:null};
function obQueue(){
  var q=["people"];
  if(OB.pick.kids>0)q.push("age");
  q.push("area");q.push("dev");
  return q;
}
function obOpen(){
  OB.pick={
    adults:Math.max(1,+S.adults||2),
    kids:(typeof S.kids==="number"?S.kids:1),
    age:S.age||"6-10",
    area:normArea(S.area),
    dev:(S.dev||[]).slice()
  };
  OB.i=0;
  var el=document.getElementById("ob");
  if(!el)return;
  el.hidden=false;el.classList.add("on");
  obRender();
}
function obClose(){
  var el=document.getElementById("ob");
  if(!el)return;
  el.classList.remove("on");el.hidden=true;
}
function obNum(k,label,v,min,max){
  return '<div class="ob-num"><span class="k">'+label+'</span><span class="ctrl">'+
    '<button type="button" data-obnum="'+k+'" data-d="-1" aria-label="减少'+label+'"'+(v<=min?' disabled':'')+'>−</button>'+
    '<span class="n">'+v+'</span>'+
    '<button type="button" data-obnum="'+k+'" data-d="1" aria-label="增加'+label+'"'+(v>=max?' disabled':'')+'>+</button>'+
    '</span></div>';
}
function obOpt(v,t,s,on){
  return '<button class="ob-opt '+(on?"on":"")+'" type="button" data-obopt="'+v+'">'+
    '<span class="mk">✓</span><span><b>'+t+'</b><span>'+s+'</span></span></button>';
}
function obRender(){
  var q=obQueue();
  if(OB.i>q.length-1)OB.i=q.length-1;
  if(OB.i<0)OB.i=0;
  var step=q[OB.i];
  var dots=document.getElementById("obDots"),body=document.getElementById("obBody"),
      prev=document.getElementById("obPrev"),next=document.getElementById("obNext"),
      foot=document.getElementById("obFoot");
  if(!body)return;
  if(dots){
    var dh="";
    for(var i=0;i<q.length;i++)dh+='<i class="'+(i<=OB.i?"on":"")+'"></i>';
    dots.innerHTML=dh;
  }
  if(foot)foot.style.display="flex";
  var h="";
  if(step==="people"){
    h='<p class="ob-q">先说说，中午几个人吃饭？</p>'+
      '<p class="ob-s">买菜的量按这个算。菜单是按「一荤一素一主食」排的，多一个人就多买一份。</p>'+
      '<div class="ob-nums">'+
      obNum("adults","大人",OB.pick.adults,1,6)+
      obNum("kids","孩子",OB.pick.kids,0,4)+
      '</div>';
  }else if(step==="age"){
    h='<p class="ob-q">孩子多大？</p><p class="ob-s">按年龄估份量和口味。3-5 岁的菜要切得更碎、口味更淡。</p><div class="ob-opts">'+
      obOpt("3-5","3-5 岁","菜要切碎，口味更淡",OB.pick.age==="3-5")+
      obOpt("6-10","6-10 岁","上小学，胃口开始变大",OB.pick.age==="6-10")+
      obOpt("11-13","11-13 岁","份量接近大人",OB.pick.age==="11-13")+
      '</div>';
  }else if(step==="area"){
    h='<p class="ob-q">平时吃哪一路菜？</p><p class="ob-s">决定菜单里出现哪些本地家常菜。选错了不影响用，设置里能改。</p><div class="ob-opts">';
    AREAS.forEach(function(x){h+=obOpt(x[0],x[1],AREA_DESC[x[0]]||"",OB.pick.area===x[0]);});
    h+='</div>';
  }else{
    h='<p class="ob-q">厨房里有什么？</p><p class="ob-s">只排你家做得出来的菜。没有的别勾，免得老人对着菜谱发愁。</p><div class="ob-opts">'+
      obOpt("steamer","蒸锅","蒸蛋、蒸鱼、蒸菜要用",OB.pick.dev.indexOf("steamer")>=0)+
      obOpt("pressure","压力锅","红烧肉、炖牛肉能省一半时间",OB.pick.dev.indexOf("pressure")>=0)+
      obOpt("airfryer","空气炸锅","排骨、里脊不用起油锅",OB.pick.dev.indexOf("airfryer")>=0)+
      obOpt("oven","烤箱","用得少，有就勾",OB.pick.dev.indexOf("oven")>=0)+
      '</div>';
  }
  body.innerHTML=h;
  if(prev)prev.style.visibility=(OB.i===0?"hidden":"visible");
  if(next)next.textContent=(step==="dev"?"排这一周":"下一步");
}
function obNext(){
  var q=obQueue();
  if(q[OB.i]==="dev"){obFinish();return;}
  OB.i++;obRender();
}
function obPrev(){
  if(OB.i>0)OB.i--;
  obRender();
}
function obFinish(){
  S.adults=OB.pick.adults;
  S.kids=OB.pick.kids;
  S.people=Math.max(1,S.adults+S.kids);
  S.age=OB.pick.age;
  S.area=OB.pick.area;
  /* 免费版锁的就是这次选的这条菜路——锁「切换」，不锁「用」 */
  S.areaFree=OB.pick.area;
  S.dev=OB.pick.dev.slice();
  S.onboarded=true;
  S.week=null;              /* 按新设置重排，别留着上一套 */
  S.tick={};S.shop={};
  save();
  generate();
  obResult();
}
function obResult(){
  var w=S.week||[],n=w.length,tot=0,act=0;
  w.forEach(function(d){var m=dayMinutes(d);tot+=m.total;act+=m.active;});
  var avgT=n?Math.round(tot/n):0,avgA=n?Math.round(act/n):0;
  var first=w[0],names="";
  if(first){
    names=["protein","veg1","veg2","soup","staple"].map(function(k){return byId(first[k]);})
      .filter(Boolean).map(function(x){return x.n;}).join(" · ");
  }
  var dots=document.getElementById("obDots"),foot=document.getElementById("obFoot"),
      body=document.getElementById("obBody");
  if(dots)dots.innerHTML="";
  if(foot)foot.style.display="none";
  if(!body)return;
  body.innerHTML=
    '<div class="ob-res"><p class="big">排好了</p>'+
    '<p class="ob-s">按 '+S.people+' 口人、'+areaName()+'排的一周，只用了你家有的厨具。</p>'+
    '<div class="nums">'+
      '<div><b>'+n+'</b><span>天午饭</span></div>'+
      '<div><b>'+avgT+'</b><span>分钟上桌</span></div>'+
      '<div><b>'+avgA+'</b><span>分钟动手</span></div>'+
    '</div>'+
    (first?('<div class="card" style="text-align:left"><div class="day-top"><span class="day-name">'+first.label+
      '</span><span class="day-date">'+first.date.slice(5)+'</span></div>'+
      '<span class="form-tag">'+esc(first.form)+'</span>'+
      '<p class="hint" style="margin-top:8px">'+esc(names)+'</p></div>'):'')+
    '<p class="ob-elder"><button type="button" id="obElder">'+
      (S.elder?"字够大了，改回标准":"字太小？放大一点")+'</button></p>'+
    '<div class="ob-foot"><button class="btn" id="obDone" type="button">开始用</button></div></div>';
}

function init(){
  applyElder();
  /* 验完再刷一次：本地只存码不存结论，所以启动时重算，改 localStorage 伪造不了。
     这一下是异步的，先按「免费」渲一帧，验完立刻盖掉，肉眼看不出。 */
  licCheck().then(function(){render();});
  /* 剪贴板只在 https 或 localhost 下才给，先说清楚，别让人以为按钮坏了 */

    if(tb){
      tb.style.display="block";
      tb.textContent=(location.protocol==="file:")
        ? "这一页是从本地文件打开的，浏览器会禁掉「复制」和「分享」。要让家人正常用，把网址发给他们用浏览器打开。"
        : "这个地址不是 https，浏览器会禁掉「复制」按钮。长按文字也能复制；要一键复制，换成 https 地址。";
    }
  }

  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-v],[data-dish],[data-fb],[data-tog],[data-age],[data-av],[data-dev],[data-copyday],[data-copydish],[data-close],[data-tick],[data-shop],[data-serve],[data-copytoday],[data-copyshop],[data-resetshop],[data-pnum],[data-area],[data-obnum],[data-obopt],[data-elder]");
    if(!t)return;
    var ds=t.dataset;
    if(ds.v){
      document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===ds.v);});
      document.querySelectorAll(".view").forEach(function(v){v.classList.toggle("on",v.id==="v-"+ds.v);});

    if(ds.copyday){if(!canCopy())return payTip();copyText(dayText(+ds.copyday));return;}
    if(ds.copytoday){if(!canCopy())return payTip();copyText(todayText());return;}
    if(ds.copyshop){if(!canCopy())return payTip();copyText(shopText());return;}
    if(ds.resetshop){S.shop={};save();renderShop();return;}
    if(ds.fb){vote(ds.d,+ds.i,ds.fb);return;}
    if(ds.tick){S.tick[ds.tick]=!S.tick[ds.tick];save();renderToday();return;}
    if(ds.shop){S.shop[ds.shop]=!S.shop[ds.shop];save();renderShop();return;}
    if(ds.tog){
      var k=ds.tog;
      /* 冷却中的菜点一下先解除冷却，再点才是启用/停用 */
      if(isCold(k)){
        S.hist[k]={no:0,last:(S.hist[k]||{}).last};

    }
    if(ds.pnum){
      var pk=ds.pnum,pv=(+S[pk]||0)+(+ds.d);
      var plo=(pk==="adults")?1:0,phi=(pk==="adults")?6:4;
      if(pv<plo)pv=plo;if(pv>phi)pv=phi;

      var _base=mondayOf(new Date());

    /* 收了家人发来的菜单就别再拦着问问题，直接让他看这一周 */
    S.onboarded=true;save();
    /* 这是老人那台手机：整页只读，不出现重排、导出、激活这些字样 */
    RO=true;
    render();
    setTimeout(function(){toast("这是家人分享的一周菜单");},500);
    return;
  }

  /* 带着 #m= 却没用上：要么链接过期，要么被截断了。把地址栏擦干净再说一句，
     否则家人点开链接只会看到引导页，以为你没发。 */
  if(hashWhy){
    var _why=hashWhy;hashWhy="";
    try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
    setTimeout(function(){
      toast(_why==="stale"
        ? "这条链接是别的周的菜单了，按你家的习惯重排一份"
        : "链接没读出来，可能被截断了，按你家的习惯重排一份");
    },600);
  }

  /* 第一次来：先问四句，问完直接排出这一周。空菜单没人知道从哪下手。 */
  if(!S.onboarded){
    render();
    obOpen();
    return;
  }

  var had=!!(S.week&&S.week.length);
  var want=idealMon(),have=weekMon();
  var stale=had&&(!have||iso(have)!==iso(want));
  if(!had||stale){
    var weekend=isWeekend();
    setWeek(want);
    if(had)setTimeout(function(){toast(weekend?"周末了，下周的菜单和买菜清单先给你排好了":"新的一周，菜单已经自动排好");},400);
  }else{
    render();
  }
}


for(var _pi=0;_pi<PSV.length;_pi++){var _pd=byId(PSV[_pi]);if(_pd)_pd.psv=1;}
init();
}catch(err){
  if(window.console)console.error(err);
  var el=document.getElementById("v-week");
  if(el)el.innerHTML='<div class="empty">页面出了点问题，刷新试试。</div>';
}
})();
</script>
